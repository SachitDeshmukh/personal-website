name: Deploy Website Build to GitHub Pages

on:
  push:
    branches:
      - release # Triggers the build whenever you push code to the release branch

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to prevent race conditions
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Clones your code into the runner container

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: uv sync

      - name: Run Build Script
        run: uv run python scripts/build.py

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist" # CHANGE THIS to match the exact directory your build.py writes to

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
